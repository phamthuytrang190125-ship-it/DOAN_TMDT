<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn Thuê Của Tôi - WeddingDress</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="my-orders.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">WeddingDress</a>

        <div class="d-flex align-items-center gap-3">
            <a href="index.html" class="nav-link text-white">
                <i class="bi bi-house"></i> Trang Chủ
            </a>
            <span class="text-white">Đơn Thuê Của Tôi</span>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
        <div>
            <h2 class="fw-bold page-title">
                Đơn Thuê Của Tôi
            </h2>
            <p class="text-muted mb-0">Theo dõi thông tin và trạng thái các đơn thuê váy cưới.</p>
        </div>

        <a href="index.html" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Tiếp tục thuê váy
        </a>
    </div>

    <!-- Khu vực hiển thị thông báo kết quả từ VNPay trả về -->
    <div id="vnpay-alert" class="d-none mb-4"></div>

    <div id="message" class="alert alert-info">
        <i class="bi bi-hourglass-split"></i> Đang tải danh sách đơn thuê...
    </div>

    <div id="orders-list" class="row g-4"></div>
</div>

<script>
const API_BASE = "http://127.0.0.1:8000/api";

const statusInfo = {
    PENDING: {
        label: "Chờ xác nhận",
        className: "badge-pending"
    },
    CONFIRMED: {
        label: "Đã xác nhận",
        className: "badge-confirmed"
    },
    RENTING: {
        label: "Đang thuê",
        className: "badge-renting"
    },
    RETURNED: {
        label: "Đã trả váy",
        className: "badge-confirmed"
    },
    COMPLETED: {
        label: "Hoàn thành",
        className: "badge-completed"
    },
    CANCELLED: {
        label: "Đã hủy",
        className: "badge-cancelled"
    }
};

const paymentMethodInfo = {
    COD: "Thanh toán khi nhận hàng (COD)",
    BANK_TRANSFER: "Chuyển khoản ngân hàng (VNPay)"
};

function formatMoney(value) {
    return new Intl.NumberFormat("vi-VN", {
        style: "currency",
        currency: "VND"
    }).format(Number(value) || 0);
}

function formatDate(value) {
    if (!value) return "Chưa có thông tin";

    const parts = String(value).slice(0, 10).split("-");
    if (parts.length !== 3) return value;

    return `${parts[2]}/${parts[1]}/${parts[0]}`;
}

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, function (char) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        }[char];
    });
}

// ==========================================
// 1. KIỂM TRA KẾT QUẢ TRẢ VỀ TỪ CỔNG VNPAY
// ==========================================
async function checkVNPayReturn() {
    const urlParams = new URLSearchParams(window.location.search);
    const responseCode = urlParams.get('vnp_ResponseCode');
    const txnRef = urlParams.get('vnp_TxnRef');
    const amount = urlParams.get('vnp_Amount');

    if (responseCode) {
        const alertBox = document.getElementById('vnpay-alert');
        alertBox.classList.remove('d-none');
        
        const orderCode = txnRef ? txnRef.split('_')[0] : '';
        const paidAmount = amount ? formatMoney(Number(amount) / 100) : '';

        if (responseCode === "00") {
            alertBox.className = "alert alert-success alert-dismissible fade show shadow-sm mb-4";
            alertBox.innerHTML = `
                <i class="bi bi-check-circle-fill me-2 fs-5"></i>
                <strong>Thanh toán VNPay thành công!</strong> Giao dịch cho đơn hàng <b>${escapeHTML(orderCode)}</b> với số tiền <b>${paidAmount}</b> đã được hệ thống ghi nhận.
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            `;

            // TỰ ĐỘNG GỌI API CẬP NHẬT TRẠNG THÁI SANG CONFIRMED (ĐÃ XÁC NHẬN)
            // (Nếu cần thiết, ta có thể gọi endpoint update status ở đây cho mượt mà)
            
        } else {
            alertBox.className = "alert alert-danger alert-dismissible fade show shadow-sm mb-4";
            alertBox.innerHTML = `
                <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                <strong>Giao dịch VNPay không thành công!</strong> Thanh toán đã bị hủy hoặc xảy ra lỗi (Mã lỗi: ${escapeHTML(responseCode)}).
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            `;
        }

        window.history.replaceState({}, document.title, window.location.pathname);
    }
}

// ==========================================
// 2. HÀM GỌI THANH TOÁN LẠI QUA VNPAY
// ==========================================
async function payAgainVNPay(orderCode, totalAmount) {
    try {
        const response = await fetch(`${API_BASE}/create_payment_url`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                order_id: orderCode, 
                amount: Number(totalAmount) 
            })
        });
        
        if (!response.ok) {
            alert("Không thể khởi tạo link thanh toán VNPay!");
            return;
        }

        const data = await response.json();
        if (data.payment_url) {
            window.location.href = data.payment_url;
        }
    } catch (error) {
        console.error("Lỗi kết nối VNPay:", error);
        alert("Lỗi kết nối đến máy chủ thanh toán!");
    }
}

// ==========================================
// 3. API HỦY ĐƠN HÀNG
// ==========================================
async function cancelOrder(orderId) {
    if (!confirm(`Bạn có chắc chắn muốn hủy đơn hàng #${orderId} không?`)) return;
    
    const token = localStorage.getItem('access_token');
    if (!token) {
        alert("Vui lòng đăng nhập lại!");
        return;
    }

    try {
        const response = await fetch(`${API_BASE}/orders/${orderId}/cancel`, { 
            method: 'PUT',
            headers: { 
                'Authorization': `Bearer ${token}`
            }
        });
        
        const result = await response.json();
        
        if (response.ok) {
            alert(result.message || "Đã hủy đơn hàng thành công!");
            loadMyOrders(); // Tải lại danh sách mượt mà không cần F5
        } else {
            alert("Lỗi: " + (result.detail || "Không thể hủy đơn"));
        }
    } catch (error) { 
        alert('Lỗi kết nối Backend!'); 
    }
}

// ==========================================
// 4. TẢI DANH SÁCH ĐƠN THUÊ
// ==========================================
async function loadMyOrders() {
    const message = document.getElementById("message");
    const ordersList = document.getElementById("orders-list");
    const token = localStorage.getItem("access_token");
    const userId = localStorage.getItem("user_id");

    if (!token || !userId) {
        message.className = "alert alert-warning";
        message.innerHTML = `
            Bạn cần đăng nhập để xem đơn thuê.
            <a href="index.html" class="alert-link">Quay lại trang chủ</a>
            để đăng nhập nhé.
        `;
        return;
    }

    try {
        const response = await fetch(`${API_BASE}/my-orders?user_id=${userId}`, {
            method: "GET",
            headers: {
                "Authorization": `Bearer ${token}`
            }
        });

        if (response.status === 401) {
            message.className = "alert alert-warning";
            message.innerHTML = `
                Phiên đăng nhập không hợp lệ hoặc đã hết hạn.
                Vui lòng <a href="index.html" class="alert-link">quay lại trang chủ</a>
                và đăng nhập lại.
            `;
            return;
        }

        if (!response.ok) {
            throw new Error(`Không thể tải đơn thuê (HTTP ${response.status}).`);
        }

        const orders = await response.json();

        if (!Array.isArray(orders) || orders.length === 0) {
            message.className = "alert alert-info";
            message.innerHTML = `
                <i class="bi bi-inbox"></i>
                Bạn chưa có đơn thuê nào.
                <a href="index.html" class="alert-link">Khám phá bộ sưu tập váy cưới</a>.
            `;
            ordersList.innerHTML = "";
            return;
        }

        message.classList.add("d-none");

        ordersList.innerHTML = orders.map(order => {
            const status = statusInfo[order.status] || {
                label: order.status || "Chưa xác định",
                className: "bg-secondary text-white"
            };

            const paymentText = paymentMethodInfo[order.payment_method] || order.payment_method || "Thanh toán khi nhận hàng (COD)";
            const displayOrderCode = order.order_code || order.id;

            // Logic hiển thị phần hoàn tiền nếu đơn đã Hoàn thành và có lịch sử hoàn cọc
            let refundHTML = '';
            if (order.status === 'COMPLETED' && order.refund_amount) {
                refundHTML = `
                    <div class="mt-3 p-3 border border-success rounded" style="background-color: #f1f8f5;">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <span class="text-success fw-bold"><i class="bi bi-check-circle-fill me-1"></i> Chi tiết hoàn tiền:</span>
                            <span class="fs-6 fw-bold text-success">+${formatMoney(order.refund_amount)}</span>
                        </div>
                        <small class="text-muted"><i class="bi bi-info-circle me-1"></i>${escapeHTML(order.refund_note)}</small>
                    </div>
                `;
            }

            // Xử lý logic hiển thị nút Thanh toán VNPay & Hủy đơn khi đang PENDING
            let actionBtnHTML = '';
            if (order.status === 'PENDING') {
                const totalToPay = Number(order.total_amount || 0) + Number(order.deposit_amount || 0);
                
                let vnpayBtn = '';
                if (order.payment_method === 'BANK_TRANSFER') {
                    vnpayBtn = `
                        <button class="btn btn-sm btn-primary px-3 me-2" onclick="payAgainVNPay('${escapeHTML(displayOrderCode)}', ${totalToPay})">
                            <i class="bi bi-credit-card-2-front me-1"></i> Thanh toán VNPay
                        </button>
                    `;
                }

                actionBtnHTML = `
                    <div class="mt-3 text-end border-top pt-3" style="border-color: #e8dfcf !important;">
                        ${vnpayBtn}
                        <button class="btn btn-sm btn-outline-danger px-4" onclick="cancelOrder(${order.id})">
                            <i class="bi bi-x-circle me-1"></i> Hủy đơn hàng này
                        </button>
                    </div>
                `;
            }

            return `
                <div class="col-12">
                    <div class="card order-card border-0">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
                                <div>
                                    <h5 class="fw-bold mb-1" style="color: #4a3b00;">
                                        <i class="bi bi-receipt"></i>
                                        Đơn ${escapeHTML(displayOrderCode)}
                                    </h5>
                                    <small class="text-muted">
                                        Ngày đặt:
                                        ${escapeHTML(formatDate(order.created_at))}
                                    </small>
                                </div>

                                <span class="badge ${status.className} fs-6 px-3 py-2">
                                    ${escapeHTML(status.label)}
                                </span>
                            </div>

                            <hr style="border-color: #e8dfcf;">

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <p class="text-muted mb-1">Váy cưới</p>
                                    <div class="fw-semibold text-dark">
                                        ${escapeHTML(order.dress_name || "Chưa có thông tin")}
                                    </div>
                                </div>

                                <div class="col-md-3">
                                    <p class="text-muted mb-1">Ngày nhận váy</p>
                                    <div class="fw-medium">${escapeHTML(formatDate(order.start_date))}</div>
                                </div>

                                <div class="col-md-3">
                                    <p class="text-muted mb-1">Ngày trả váy</p>
                                    <div class="fw-medium">${escapeHTML(formatDate(order.end_date))}</div>
                                </div>

                                <div class="col-md-6">
                                    <p class="text-muted mb-1">Địa chỉ giao hàng</p>
                                    <div>${escapeHTML(order.shipping_address || "Chưa có thông tin")}</div>
                                </div>

                                <div class="col-md-2">
                                    <p class="text-muted mb-1">Số lượng</p>
                                    <div>${escapeHTML(order.quantity ?? 1)}</div>
                                </div>

                                <div class="col-md-4">
                                    <p class="text-muted mb-1">Phương thức thanh toán</p>
                                    <div class="fw-semibold text-dark">
                                        <i class="bi bi-credit-card me-1 text-warning"></i>
                                        ${escapeHTML(paymentText)}
                                    </div>
                                </div>
                            </div>

                            <div class="mt-4 pt-3 border-top d-flex justify-content-between align-items-center flex-wrap gap-3" style="border-color: #e8dfcf !important;">
                                <div>
                                    <span class="text-muted me-2">Tiền cọc:</span>
                                    <span class="fw-bold text-secondary">${escapeHTML(formatMoney(order.deposit_amount))}</span>
                                </div>
                                <div>
                                    <span class="text-muted me-2">Tổng tiền thuê:</span>
                                    <span class="fs-5 fw-bold text-danger">
                                        ${escapeHTML(formatMoney(order.total_amount))}
                                    </span>
                                </div>
                            </div>

                            <!-- Hiển thị thông báo hoàn tiền nếu có -->
                            ${refundHTML}
                            
                            <!-- Hiển thị nút Thanh toán VNPay & Hủy đơn nếu đang PENDING -->
                            ${actionBtnHTML}
                        </div>
                    </div>
                </div>
            `;
        }).join("");

    } catch (error) {
        console.error("Lỗi tải đơn thuê:", error);
        message.className = "alert alert-danger";
        message.textContent = "Không tải được danh sách đơn thuê. Hãy kiểm tra backend có đang chạy và thử tải lại trang.";
    }
}

// Chạy kiểm tra kết quả VNPay trước rồi tải danh sách đơn
checkVNPayReturn();
loadMyOrders();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
